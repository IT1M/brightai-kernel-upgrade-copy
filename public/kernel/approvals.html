<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>BrightAI Approvals - Governance Review</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0e27;
      --card: #111827;
      --accent: #00d9ff;
      --purple: #7c3aed;
      --danger: #dc2626;
      --orange: #ea580c;
      --green: #10b981;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --border: #1e293b;
    }

    html, body {
      background: linear-gradient(135deg, #0a0e27 0%, #0f172a 50%, #0a0e27 100%);
      color: var(--text);
      font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', sans-serif;
      min-height: 100vh;
    }

    input, textarea, select {
      font-size: 16px !important;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-button {
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    .summary-bar {
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .requests-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .request-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(0, 217, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .request-card:hover {
      border-color: rgba(0, 217, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.1);
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .request-id {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .risk-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .risk-critical {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.3);
    }

    .risk-high {
      background: rgba(234, 88, 12, 0.2);
      color: #fdba74;
      border: 1px solid rgba(234, 88, 12, 0.3);
    }

    .risk-medium {
      background: rgba(245, 158, 11, 0.2);
      color: #fde047;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .request-query {
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    .request-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .request-rules {
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.1);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .request-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      touch-action: manipulation;
    }

    .btn-approve {
      background: var(--green);
      color: white;
    }

    .btn-approve:hover:not(:disabled) {
      background: #059669;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .btn-reject {
      background: var(--danger);
      color: white;
    }

    .btn-reject:hover:not(:disabled) {
      background: #b91c1c;
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .approval-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(0, 217, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .request-header {
        flex-direction: column;
      }

      .request-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .summary-bar {
        grid-template-columns: 1fr;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a href="/" class="logo">🔐 BrightAI Kernel</a>
        <div style="display: flex; gap: 12px;">
          <a href="/kernel/chat.html" class="nav-button">Chat</a>
          <a href="/kernel/stats.html" class="nav-button">Stats</a>
          <a href="/kernel/audit.html" class="nav-button">Audit</a>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Governance Review</h1>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">Pending Review</div>
        <div class="summary-value" id="total-pending">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">Critical Risk</div>
        <div class="summary-value" id="critical-count">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">High Risk</div>
        <div class="summary-value" id="high-count">0</div>
      </div>
    </div>

    <div class="requests-list" id="requests-list">
      <div class="loading">Loading requests...</div>
    </div>
  </div>

  <script src="/kernel/js/api-client.js"></script>
  <script>
    async function loadApprovals() {
      try {
        const response = await fetch('/api/approvals');
        const data = await response.json();

        document.getElementById('total-pending').textContent = data.summary.totalPending;
        document.getElementById('critical-count').textContent = data.summary.criticalCount;
        document.getElementById('high-count').textContent = data.summary.highCount;

        const requestsList = document.getElementById('requests-list');
        
        if (data.pending.length === 0) {
          requestsList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">✓</div>
              <h2>All Clear</h2>
              <p>No pending approvals. All requests are current.</p>
            </div>
          `;
          return;
        }

        requestsList.innerHTML = data.pending.map(req => {
          const riskClass = req.riskLevel.replace('-', '_');
          const approvalPercentage = (req.approvalCount / req.requiredApprovals) * 100;
          
          return `
            <div class="request-card">
              <div class="request-header">
                <div>
                  <div class="request-id">Request ID: ${req.id.substring(0, 12)}...</div>
                  <div class="request-query">"${req.query.substring(0, 100)}${req.query.length > 100 ? '...' : ''}"</div>
                </div>
                <span class="risk-badge risk-${riskClass}">${req.riskLevel.toUpperCase()}</span>
              </div>

              <div class="request-meta">
                <span>Risk Score: ${req.riskScore}%</span>
                <span>Created: ${new Date(req.createdAt).toLocaleTimeString()}</span>
              </div>

              <div class="approval-progress">
                <span>${req.approvalCount}/${req.requiredApprovals} approved</span>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${approvalPercentage}%"></div>
                </div>
              </div>

              <div class="request-rules">
                <strong>Matched Rules:</strong><br>
                ${req.matchedRules.map(r => `• ${r.name}`).join('<br>')}
              </div>

              <div class="request-actions">
                <button class="btn btn-approve" onclick="approveRequest('${req.id}')">✓ Approve</button>
                <button class="btn btn-reject" onclick="rejectRequest('${req.id}')">✗ Reject</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.log('[v0] Failed to load approvals:', error);
        document.getElementById('requests-list').innerHTML = `<div class="empty-state"><p>Error loading approvals</p></div>`;
      }
    }

    async function approveRequest(requestId) {
      try {
        const response = await fetch('/api/approvals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requestId,
            action: 'approve',
            approver: 'Admin User'
          })
        });

        if (response.ok) {
          loadApprovals();
        }
      } catch (error) {
        console.log('[v0] Approval failed:', error);
      }
    }

    async function rejectRequest(requestId) {
      try {
        const response = await fetch('/api/approvals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requestId,
            action: 'reject',
            approver: 'Admin User'
          })
        });

        if (response.ok) {
          loadApprovals();
        }
      } catch (error) {
        console.log('[v0] Rejection failed:', error);
      }
    }

    loadApprovals();
    setInterval(loadApprovals, 3000);
  </script>
</body>
</html>
