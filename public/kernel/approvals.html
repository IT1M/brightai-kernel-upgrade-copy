<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030A18">
  <title>الموافقات - نواة BrightAI</title>
  <meta name="description" content="مراجعة وموافقة الطلبات المعلّقة في خط حوكمة الذكاء الاصطناعي">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/kernel/assets/css/kernel.css">
  <style>
    .page-header {
      padding: var(--space-8) 0 var(--space-6);
    }

    .page-header h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: var(--space-2);
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    /* Summary Bar */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }

    @media (max-width: 768px) {
      .summary-bar { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .summary-bar { grid-template-columns: 1fr 1fr; }
    }

    .summary-stat {
      padding: var(--space-4);
      text-align: center;
    }

    .summary-stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--brand);
      font-variant-numeric: tabular-nums;
    }

    .summary-stat-value.danger { color: var(--danger); }
    .summary-stat-value.warning { color: var(--warning); }
    .summary-stat-value.success { color: var(--success); }

    .summary-stat-label {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-top: var(--space-1);
    }

    /* Filters */
    .filters-bar {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
      align-items: center;
    }

    .filter-btn {
      padding: var(--space-2) var(--space-4);
      background: var(--ink-800);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 44px;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(0, 212, 255, 0.1);
      border-color: var(--brand);
      color: var(--brand);
    }

    /* Requests List */
    .requests-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    /* Request Card */
    .request-card {
      padding: var(--space-5);
      position: relative;
      transition: all var(--transition-fast);
    }

    .request-card.status-expired {
      opacity: 0.6;
    }

    .request-card.status-completed {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .request-card.status-rejected {
      border-color: rgba(239, 68, 68, 0.2);
    }

    .request-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
      flex-wrap: wrap;
    }

    .request-meta-left {
      flex: 1;
      min-width: 0;
    }

    .request-id-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-2);
      flex-wrap: wrap;
    }

    .request-id-code {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      background: var(--ink-800);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
    }

    .request-query-text {
      font-size: 0.9375rem;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: var(--space-3);
      word-break: break-word;
    }

    .request-query-masked {
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      background: var(--ink-800);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-3);
      font-family: monospace;
      word-break: break-all;
    }

    .request-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 0.6875rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-value {
      font-size: 0.875rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Risk Bar */
    .risk-bar-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .risk-bar-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      width: 72px;
      flex-shrink: 0;
    }

    .risk-bar-track {
      flex: 1;
      height: 6px;
      background: var(--ink-700);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .risk-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
    }

    .risk-bar-value {
      font-size: 0.8125rem;
      font-weight: 600;
      width: 40px;
      text-align: end;
    }

    /* PII and Policies Chips */
    .chips-section {
      margin-bottom: var(--space-3);
    }

    .chips-label {
      font-size: 0.6875rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .chip-pii {
      padding: 2px var(--space-2);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-full);
      font-size: 0.6875rem;
      color: var(--danger);
    }

    .chip-policy {
      padding: 2px var(--space-2);
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius-full);
      font-size: 0.6875rem;
      color: var(--warning);
    }

    /* SLA */
    .sla-bar-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .sla-label {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      width: 72px;
      flex-shrink: 0;
    }

    .sla-track {
      flex: 1;
      height: 4px;
      background: var(--ink-700);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .sla-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.3s;
    }

    .sla-value {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    /* Actions */
    .request-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    @media (max-width: 480px) {
      .request-actions .btn { flex: 1; }
    }

    /* Execution Result */
    .execution-result {
      margin-top: var(--space-4);
      padding: var(--space-4);
      background: var(--ink-900);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-md);
      animation: fadeSlideUp 300ms ease-out;
    }

    .execution-result-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--success);
    }

    .execution-result-header svg { width: 18px; height: 18px; }

    .execution-result-text {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .execution-meta {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    .execution-link {
      margin-top: var(--space-2);
      font-size: 0.8125rem;
    }

    .execution-link a {
      color: var(--brand);
      text-decoration: none;
    }

    .execution-link a:hover { text-decoration: underline; }

    /* Status overlay */
    .status-overlay {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: var(--space-4);
    }

    .status-overlay.completed {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
    }

    .status-overlay.rejected {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .status-overlay.expired {
      background: rgba(107, 114, 128, 0.08);
      border: 1px solid rgba(107, 114, 128, 0.2);
      color: var(--text-tertiary);
    }

    .status-overlay svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Empty & Loading */
    .empty-state {
      text-align: center;
      padding: var(--space-16) var(--space-8);
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-4);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--success);
    }

    .empty-icon svg { width: 32px; height: 32px; }

    .empty-state h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--space-2);
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .skeleton-card {
      height: 200px;
      border-radius: var(--radius-lg);
    }

    /* Approve/Reject confirmation */
    .action-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-loading .action-spinner { display: inline-block; }
    .btn-loading .btn-label { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">تخطي إلى المحتوى</a>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <main id="main-content">
    <div class="container">
      <!-- Page Header -->
      <div class="page-header">
        <h1>مراجعة الحوكمة</h1>
        <p>الطلبات المعلّقة التي تحتاج موافقة إدارية قبل تنفيذها بالذكاء الاصطناعي</p>
      </div>

      <!-- Summary Bar -->
      <div class="summary-bar" id="summary-bar">
        <div class="glass-card summary-stat">
          <div class="summary-stat-value" id="stat-pending">
            <span class="skeleton" style="width:40px; height:36px; display:inline-block;"></span>
          </div>
          <div class="summary-stat-label">بانتظار المراجعة</div>
        </div>
        <div class="glass-card summary-stat">
          <div class="summary-stat-value danger" id="stat-critical">
            <span class="skeleton" style="width:40px; height:36px; display:inline-block;"></span>
          </div>
          <div class="summary-stat-label">خطر حرج</div>
        </div>
        <div class="glass-card summary-stat">
          <div class="summary-stat-value warning" id="stat-high">
            <span class="skeleton" style="width:40px; height:36px; display:inline-block;"></span>
          </div>
          <div class="summary-stat-label">خطر مرتفع</div>
        </div>
        <div class="glass-card summary-stat">
          <div class="summary-stat-value success" id="stat-completed">
            <span class="skeleton" style="width:40px; height:36px; display:inline-block;"></span>
          </div>
          <div class="summary-stat-label">مكتمل اليوم</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters-bar" role="group" aria-label="فلاتر الطلبات">
        <button class="filter-btn active" data-filter="pending" onclick="setFilter(this,'pending')">قيد الانتظار</button>
        <button class="filter-btn" data-filter="all" onclick="setFilter(this,'all')">الكل</button>
        <button class="filter-btn" data-filter="completed" onclick="setFilter(this,'completed')">مكتملة</button>
        <button class="filter-btn" data-filter="rejected" onclick="setFilter(this,'rejected')">مرفوضة</button>
        <button class="filter-btn" data-filter="expired" onclick="setFilter(this,'expired')">منتهية</button>
      </div>

      <!-- Requests List -->
      <div class="requests-list" id="requests-list">
        <!-- Skeleton Loading -->
        <div class="loading-state" id="loading-state">
          <div class="glass-card skeleton-card skeleton"></div>
          <div class="glass-card skeleton-card skeleton"></div>
          <div class="glass-card skeleton-card skeleton"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="/kernel/assets/js/kernel-utils.js"></script>
  <script src="/kernel/assets/js/kernel-api.js"></script>
  <script src="/kernel/assets/js/kernel-nav.js"></script>

  <script>
    let allRequests = [];
    let currentFilter = 'pending';
    let refreshTimer;

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      loadApprovals();
      refreshTimer = setInterval(loadApprovals, 15000);
    });

    // ── Load Data ──
    async function loadApprovals() {
      try {
        const data = await kernelAPI.getPendingApprovals();
        allRequests = [
          ...(data.pending || []),
          ...(data.recent || []),
        ];
        updateSummary(data.summary || {});
        renderList();
      } catch (err) {
        document.getElementById('loading-state').style.display = 'none';
        const list = document.getElementById('requests-list');
        list.innerHTML = `
          <div class="glass-card empty-state">
            <p style="color:var(--danger);">تعذّر تحميل البيانات. يرجى التحديث.</p>
          </div>
        `;
      }
    }

    function updateSummary(s) {
      document.getElementById('stat-pending').textContent = KernelUtils.formatNumber(s.totalPending || 0);
      document.getElementById('stat-critical').textContent = KernelUtils.formatNumber(s.criticalCount || 0);
      document.getElementById('stat-high').textContent = KernelUtils.formatNumber(s.highCount || 0);
      document.getElementById('stat-completed').textContent = KernelUtils.formatNumber(s.completedToday || 0);
    }

    function setFilter(btn, filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function renderList() {
      document.getElementById('loading-state').style.display = 'none';
      const list = document.getElementById('requests-list');

      let items = allRequests;
      if (currentFilter === 'pending') {
        items = allRequests.filter(r => ['pending', 'escalated'].includes(r.status));
      } else if (currentFilter !== 'all') {
        items = allRequests.filter(r => r.status === currentFilter);
      }

      if (items.length === 0) {
        list.innerHTML = `
          <div class="glass-card">
            <div class="empty-state">
              <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <h3>${currentFilter === 'pending' ? 'لا توجد طلبات معلّقة' : 'لا توجد نتائج'}</h3>
              <p>${currentFilter === 'pending' ? 'جميع الطلبات تمّت معالجتها.' : 'جرّب فلتراً مختلفاً.'}</p>
            </div>
          </div>
        `;
        return;
      }

      list.innerHTML = items.map(req => buildRequestCard(req)).join('');
    }

    function buildRequestCard(req) {
      const riskScore = req.riskScore || 0;
      const riskColor = riskScore < 30 ? 'var(--success)' : riskScore < 60 ? 'var(--warning)' : 'var(--danger)';
      const riskLabel = KernelUtils.getRiskLabel(req.riskLevel || 'low');
      const statusLabel = KernelUtils.getDecisionLabel(req.status || 'pending');
      const statusClass = KernelUtils.getDecisionClass(req.status || 'pending');

      const piiItems = req.piiDetected || req.piiTypes || [];
      const policies = req.matchedPolicies || req.matchedRules || [];

      const createdAt = req.createdAt ? KernelUtils.formatRelativeTime(req.createdAt) : '—';
      const slaHours = 24;
      const createdMs = req.createdAt ? new Date(req.createdAt).getTime() : Date.now();
      const elapsedHours = (Date.now() - createdMs) / 3600000;
      const slaPercent = Math.min((elapsedHours / slaHours) * 100, 100);
      const slaColor = slaPercent < 50 ? 'var(--success)' : slaPercent < 80 ? 'var(--warning)' : 'var(--danger)';
      const slaRemaining = Math.max(0, slaHours - elapsedHours);
      const slaText = slaRemaining < 1 ? `منتهي` : `${Math.ceil(slaRemaining)} ساعة متبقية`;
      const isExpired = req.status === 'expired' || slaRemaining <= 0;

      const isPending = ['pending', 'escalated'].includes(req.status);
      const isCompleted = ['completed', 'executed_after_approval'].includes(req.status);
      const isRejected = req.status === 'rejected';

      return `
        <div class="glass-card request-card status-${req.status || 'pending'}" id="card-${req.id}">
          <div class="request-card-top">
            <div class="request-meta-left">
              <div class="request-id-row">
                <code class="request-id-code">${KernelUtils.escapeHtml((req.id || '').substring(0, 16))}...</code>
                <span class="badge ${statusClass}">${statusLabel}</span>
                ${isExpired && isPending ? '<span class="badge badge-danger">منتهي SLA</span>' : ''}
              </div>
              <div class="request-query-text">"${KernelUtils.escapeHtml((req.query || req.originalText || '').substring(0, 200))}${(req.query || '').length > 200 ? '...' : ''}"</div>
              ${req.maskedText && req.maskedText !== req.query ? `
              <div class="request-query-masked">
                <span style="color:var(--text-tertiary); font-size:0.6875rem; display:block; margin-bottom:4px;">النص بعد الإخفاء:</span>
                ${KernelUtils.escapeHtml(req.maskedText.substring(0, 200))}...
              </div>` : ''}
            </div>
          </div>

          <!-- Info Grid -->
          <div class="request-info-grid">
            <div class="info-item">
              <span class="info-label">حزمة الامتثال</span>
              <span class="info-value">${KernelUtils.escapeHtml(req.compliancePackage || 'عام')}</span>
            </div>
            <div class="info-item">
              <span class="info-label">المستخدم</span>
              <span class="info-value">${KernelUtils.escapeHtml(req.userName || req.userId || 'مستخدم')}</span>
            </div>
            <div class="info-item">
              <span class="info-label">الوقت</span>
              <span class="info-value">${createdAt}</span>
            </div>
            ${req.approver ? `
            <div class="info-item">
              <span class="info-label">المُراجع</span>
              <span class="info-value">${KernelUtils.escapeHtml(req.approver)}</span>
            </div>` : ''}
          </div>

          <!-- Risk Bar -->
          <div class="risk-bar-row">
            <span class="risk-bar-label">${riskLabel}</span>
            <div class="risk-bar-track">
              <div class="risk-bar-fill" style="width:${riskScore}%; background:${riskColor};"></div>
            </div>
            <span class="risk-bar-value" style="color:${riskColor};">${riskScore}%</span>
          </div>

          <!-- SLA Bar (pending only) -->
          ${isPending ? `
          <div class="sla-bar-row">
            <span class="sla-label">SLA</span>
            <div class="sla-track">
              <div class="sla-fill" style="width:${slaPercent}%; background:${slaColor};"></div>
            </div>
            <span class="sla-value" style="color:${slaColor};">${slaText}</span>
          </div>` : ''}

          <!-- PII -->
          ${piiItems.length > 0 ? `
          <div class="chips-section">
            <div class="chips-label">بيانات حساسة</div>
            <div class="chips-row">${piiItems.map(p => `<span class="chip-pii">${KernelUtils.escapeHtml(typeof p === 'string' ? p : p.type || p)}</span>`).join('')}</div>
          </div>` : ''}

          <!-- Policies -->
          ${policies.length > 0 ? `
          <div class="chips-section">
            <div class="chips-label">السياسات المطلوبة</div>
            <div class="chips-row">${policies.map(p => `<span class="chip-policy">${KernelUtils.escapeHtml(typeof p === 'string' ? p : p.name || p)}</span>`).join('')}</div>
          </div>` : ''}

          <!-- Status Overlays -->
          ${isCompleted ? `
          <div class="status-overlay completed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            تمت الموافقة وتنفيذ الذكاء الاصطناعي بنجاح.
          </div>` : ''}

          ${isRejected ? `
          <div class="status-overlay rejected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            تم رفض الطلب.${req.rejectionReason ? ' السبب: ' + KernelUtils.escapeHtml(req.rejectionReason) : ''}
          </div>` : ''}

          ${req.status === 'expired' ? `
          <div class="status-overlay expired">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            انتهت صلاحية الطلب (تجاوز SLA 24 ساعة).
          </div>` : ''}

          <!-- Actions -->
          ${isPending && !isExpired ? `
          <div class="request-actions">
            <button
              class="btn btn-success"
              id="approve-btn-${req.id}"
              onclick="handleAction('${req.id}','approve',this)"
              aria-label="الموافقة على الطلب"
            >
              <span class="action-spinner" aria-hidden="true"></span>
              <span class="btn-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-2px;">
                  <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                موافقة وتنفيذ
              </span>
            </button>
            <button
              class="btn btn-danger"
              id="reject-btn-${req.id}"
              onclick="handleAction('${req.id}','reject',this)"
              aria-label="رفض الطلب"
            >
              <span class="action-spinner" aria-hidden="true"></span>
              <span class="btn-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-2px;">
                  <path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                رفض
              </span>
            </button>
            <a href="/kernel/evidence.html?id=${encodeURIComponent(req.id)}" class="btn btn-ghost">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-2px;">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              الأدلة
            </a>
          </div>` : ''}

          <!-- Execution Result Container -->
          <div id="result-${req.id}" style="display:none;"></div>
        </div>
      `;
    }

    // ── Approve / Reject ──
    async function handleAction(requestId, action, btn) {
      const approver = KernelUtils.getUserName() || 'مدير النظام';
      const cardId = `card-${requestId}`;

      // Set loading state on button
      btn.classList.add('btn-loading');
      btn.disabled = true;

      // Disable sibling button
      const siblingSelector = action === 'approve' ? `#reject-btn-${requestId}` : `#approve-btn-${requestId}`;
      const sibling = document.querySelector(siblingSelector);
      if (sibling) sibling.disabled = true;

      try {
        let result;
        if (action === 'approve') {
          result = await kernelAPI.approveRequest(requestId, approver);
        } else {
          const reason = prompt('سبب الرفض (اختياري):') || '';
          result = await kernelAPI.rejectRequest(requestId, approver, reason);
        }

        if (action === 'approve') {
          showApprovalResult(requestId, result);
          showToast('تمت الموافقة', 'جاري تنفيذ الذكاء الاصطناعي...', 'success');
        } else {
          showToast('تم الرفض', 'تم رفض الطلب بنجاح.', 'info');
        }

        // Refresh after a moment
        setTimeout(() => { loadApprovals(); }, 1500);

      } catch (err) {
        showToast('خطأ', err.message || 'تعذر تنفيذ الإجراء', 'error');
        btn.classList.remove('btn-loading');
        btn.disabled = false;
        if (sibling) sibling.disabled = false;
      }
    }

    function showApprovalResult(requestId, result) {
      const container = document.getElementById(`result-${requestId}`);
      if (!container) return;

      const responseText = result.responseText || result.response || result.text || '';
      const provider = result.provider || '';
      const model = result.model || '';
      const latency = result.latencyMs || '';
      const hash = result.auditHash || result.hash || '';

      container.style.display = 'block';
      container.innerHTML = `
        <div class="execution-result">
          <div class="execution-result-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            تم التنفيذ بعد الموافقة
          </div>
          <div class="execution-result-text">${KernelUtils.escapeHtml(responseText)}</div>
          ${(provider || latency || hash) ? `
          <div class="execution-meta">
            ${provider ? `<span>المزود: ${KernelUtils.escapeHtml(provider)}${model ? ' · ' + KernelUtils.escapeHtml(model) : ''}</span>` : ''}
            ${latency ? `<span>الاستجابة: ${latency}ms</span>` : ''}
            ${hash ? `<span>الهاش: <code style="font-size:0.6875rem;">${hash.substring(0, 16)}...</code></span>` : ''}
          </div>` : ''}
          ${result.requestId ? `
          <div class="execution-link">
            <a href="/kernel/evidence.html?id=${encodeURIComponent(result.requestId)}">عرض سجل الأدلة الكاملة</a>
          </div>` : ''}
        </div>
      `;
    }

    // ── Toast ──
    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="${type === 'success' ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' : type === 'error' ? 'M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z' : 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}"/>
        </svg>
        <div class="toast-content">
          ${title ? `<div class="toast-title">${KernelUtils.escapeHtml(title)}</div>` : ''}
          ${message ? `<div class="toast-message">${KernelUtils.escapeHtml(message)}</div>` : ''}
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()" aria-label="إغلاق">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      `;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentElement) toast.remove(); }, 5000);
    }
  </script>
</body>
</html>
